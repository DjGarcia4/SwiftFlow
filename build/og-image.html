<!--
  The picture link previews show (public/og-image.png, 1200x630). To
  change it: edit this, open it in a browser at exactly 1200x630 (the
  devtools device toolbar will do), and save a screenshot over the PNG.
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        font-family: Nunito, sans-serif;
        background: #fffaf5;
        overflow: hidden;
        position: relative;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
      }
      .b1 {
        width: 520px;
        height: 520px;
        background: #fdba74;
        opacity: 0.55;
        left: -140px;
        top: -160px;
      }
      .b2 {
        width: 460px;
        height: 460px;
        background: #fb923c;
        opacity: 0.35;
        right: -120px;
        bottom: -180px;
      }
      .wrap {
        position: relative;
        padding: 70px 80px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #f97316;
        border-bottom: 6px solid #ea580c;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .name {
        font-size: 40px;
        font-weight: 900;
        color: #1e293b;
        letter-spacing: -0.5px;
      }
      h1 {
        margin-top: 48px;
        font-size: 76px;
        line-height: 1.02;
        font-weight: 900;
        color: #1e293b;
        letter-spacing: -1.5px;
      }
      h1 span {
        color: #f97316;
      }
      .row {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .typed {
        font-family: "JetBrains Mono", monospace;
        font-size: 30px;
        background: white;
        border: 3px solid #e2e8f0;
        border-radius: 20px;
        padding: 18px 26px;
        box-shadow: 0 20px 40px -20px rgba(249, 115, 22, 0.35);
      }
      .ok {
        color: #10b981;
      }
      .bad {
        color: #dc2626;
        background: #fee2e2;
        border-radius: 4px;
      }
      .rest {
        color: #94a3b8;
        border-left: 4px solid #f97316;
        padding-left: 2px;
      }
      .tags {
        display: flex;
        gap: 12px;
      }
      .tag {
        font-size: 22px;
        font-weight: 800;
        color: #9a3412;
        background: #ffedd5;
        border: 2px solid #fdba74;
        border-radius: 999px;
        padding: 8px 18px;
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="wrap">
      <div class="brand">
        <div class="logo">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
            <path
              fill-rule="evenodd"
              d="M14.615 1.595a.75.75 0 0 1 .359.852L12.982 9.75h7.268a.75.75 0 0 1 .548 1.262l-10.5 11.25a.75.75 0 0 1-1.272-.71l1.992-7.302H3.75a.75.75 0 0 1-.548-1.262l10.5-11.25a.75.75 0 0 1 .913-.143Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="name">SwiftFlow</div>
      </div>
      <h1>Escribí más rápido.<br /><span>Entendé por qué te equivocás.</span></h1>
      <div class="row">
        <div class="typed">
          <span class="ok">la práctica con</span><span class="bad">z</span
          ><span class="ok">tante</span> <span class="rest">cambia</span>
        </div>
        <div class="tags">
          <div class="tag">Mecanografía en español</div>
          <div class="tag">Sin cuenta</div>
        </div>
      </div>
    </div>
  </body>
</html>
